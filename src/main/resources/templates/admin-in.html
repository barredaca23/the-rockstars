<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0e2433;
      color: white;
      margin: 0;
      padding: 0;
    }

    .header {
      background-color: #45b6fe;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
    }

    .nav {
      background-color: #0e2433;
      padding: 10px;
      text-align: right;
    }

    .nav a {
      color: white;
      margin-right: 20px;
      text-decoration: none;
    }

    .nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background-color: #0e2433;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    h2 {
      color: #45b6fe;
    }
  </style>
</head>
<body>
<div class="header">
  <h1>Admin Dashboard</h1>
</div>

<div class="nav">
  <a th:href="@{/auth/admin/torneosCrud}">TORNEOS</a>
  <a th:href="@{/auth/sobreNosotros}">Sobre Nosotros</a>
  <a th:href="@{/auth/logout}">Logout</a>
  <a th:href="@{/auth/index}">inicio</a>
</div>

<div class="container">
  <h2>Bienvenido, Admin</h2>
  <!-- Aquí puedes agregar más contenido al dashboard -->
</div>
</body>
</html>
